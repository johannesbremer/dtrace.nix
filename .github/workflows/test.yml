name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - flake.lock
      - flake.nix
      - nix/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - flake.lock
      - flake.nix
      - nix/**

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test flake on x86
            runner: ubuntu-26.04
          - name: test flake on arm
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Evaluate flake
        run: nix flake check --no-build --all-systems
      - name: Run module assertions
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --no-link -L ".#checks.$system.vm"
      - name: Run upstream Linux tests
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build --no-link -L ".#checks.$system.upstream"
