name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - flake.lock
      - flake.nix
      - nix/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - flake.lock
      - flake.nix
      - nix/**

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan test matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      x86: ${{ steps.matrix.outputs.x86 }}
      arm: ${{ steps.matrix.outputs.arm }}

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: matrix
        name: Evaluate test matrix
        run: |
          echo "x86=$(nix eval --json .#lib.ciTestMatrix.x86_64-linux)" >> "$GITHUB_OUTPUT"
          echo "arm=$(nix eval --json .#lib.ciTestMatrix.aarch64-linux)" >> "$GITHUB_OUTPUT"

  prepare:
    name: prepare flake on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - arm
        include:
          - arch: x86
            runner: ubuntu-26.04
            system: x86_64-linux
            enable_kvm: true
            system_features: nixos-test benchmark big-parallel kvm
          - arch: arm
            runner: ubuntu-26.04-arm
            system: aarch64-linux
            enable_kvm: false
            system_features: nixos-test benchmark big-parallel

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: ${{ matrix.enable_kvm }}
          extra_nix_config: system-features = ${{ matrix.system_features }}
      - name: Evaluate flake
        run: nix flake check --no-build --all-systems
      - name: Prepare module check and consumer closure
        run: |
          nix build --no-link -L \
            ".#checks.${{ matrix.system }}.vm" \
            ".#packages.${{ matrix.system }}.upstream-test-closure"
      - name: Export prepared Nix closure
        run: |
          nix copy \
            --to "file://${RUNNER_TEMP}/nix-cache?compression=zstd&parallel-compression=true" \
            ".#packages.${{ matrix.system }}.upstream-test-closure"
      - name: Upload prepared Nix closure
        uses: actions/upload-artifact@v7
        with:
          name: nix-cache-${{ matrix.system }}
          path: ${{ runner.temp }}/nix-cache
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test-x86:
    name: test ${{ matrix.coverage }} on x86 (${{ matrix.shard }}/${{ matrix.shards }})
    needs: [plan, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.x86) }}

    runs-on: ubuntu-26.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Require KVM acceleration
        run: |
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::KVM acceleration is unavailable; refusing to run x86 VM tests under QEMU TCG"
            exit 1
          fi
      - name: Download prepared Nix closure
        uses: actions/download-artifact@v8
        with:
          name: nix-cache-x86_64-linux
          path: ${{ runner.temp }}/nix-cache
      - name: Restore prepared Nix closure
        run: |
          nix copy --no-check-sigs \
            --from "file://${RUNNER_TEMP}/nix-cache" \
            ".#packages.x86_64-linux.upstream-test-closure"
      - name: Run upstream Linux shard
        run: nix build --no-link -L ".#checks.x86_64-linux.upstream-${{ matrix.coverage }}-${{ matrix.shard }}"

  test-arm:
    name: test ${{ matrix.coverage }} on arm (${{ matrix.shard }}/${{ matrix.shards }})
    needs: [plan, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.arm) }}

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: false
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel
      - name: Download prepared Nix closure
        uses: actions/download-artifact@v8
        with:
          name: nix-cache-aarch64-linux
          path: ${{ runner.temp }}/nix-cache
      - name: Restore prepared Nix closure
        run: |
          nix copy --no-check-sigs \
            --from "file://${RUNNER_TEMP}/nix-cache" \
            ".#packages.aarch64-linux.upstream-test-closure"
      - name: Run upstream Linux shard
        run: nix build --no-link -L ".#checks.aarch64-linux.upstream-${{ matrix.coverage }}-${{ matrix.shard }}"
